services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-bsm-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY}
      EMAILJS_TEMPLATE_ID_CONTACT: ${EMAILJS_TEMPLATE_ID_CONTACT}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: 3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-bsm-media}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:-bsm-frontend:local}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:80'

  minio:
    # quay.io/minio/minio and Docker Hub's minio/minio now require a paid
    # login even to pull, and MinIO's own free-tier replacement
    # (quay.io/minio/aistor/minio) still needs a registered license key to
    # serve S3 traffic ("No valid license found, running in offline mode").
    # bitnamilegacy/minio is a genuinely open-source (AGPLv3) mirror of the
    # pre-paywall community build that pulls and runs with no license step.
    # Pinned to a version tag since :latest can move.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    # Root: the data volume was formatted by the old image running as root,
    # so this image's default non-root user (1001) can't write to those
    # root-owned files. The image's own entrypoint chowns them back under
    # the hood on first boot, then drops to its own non-root user to
    # actually run the server.
    #
    # No `command:` override: unlike the official minio image, Bitnami's
    # entrypoint only runs its setup step (which re-indexes pre-existing
    # buckets on the volume) when invoked via its own default command.
    # Overriding `command: server /data ...` bypasses that step entirely —
    # the server starts and reports healthy, but `mc ls` shows zero buckets
    # even though bsm-media is sitting right there on disk. Configure the
    # data directory via MINIO_DATA_DIR instead (console port 9001 is
    # already this image's default, same as the old --console-address flag).
    user: '0'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DATA_DIR: /data
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        (mc mb local/${MINIO_BUCKET:-bsm-media} || true) &&
        mc anonymous set download local/${MINIO_BUCKET:-bsm-media}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

volumes:
  pgdata:
  miniodata:
